spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Force SSL en prod (override le default "prefer" de application.yml).
        sslmode: ${DB_SSL_MODE:require}

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

logging:
  level:
    fr.leadrevive: INFO
    org.hibernate.SQL: WARN
