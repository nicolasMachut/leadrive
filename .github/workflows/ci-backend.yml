name: CI Backend

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop, master]
    paths: ['backend/**']
  pull_request:
    branches: [main, develop, master]
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: leadrevive_test
          POSTGRES_USER: leadrevive
          POSTGRES_PASSWORD: leadrevive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: TU + TI
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/leadrevive_test
          SPRING_DATASOURCE_USERNAME: leadrevive
          SPRING_DATASOURCE_PASSWORD: leadrevive
          JWT_SECRET: ci-test-secret-key-minimum-256-bits-long-for-hmac-sha
        run: mvn clean verify -q
