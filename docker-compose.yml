services:

  postgres:
    image: postgres:16-alpine
    container_name: leadrevive-postgres
    environment:
      POSTGRES_DB: leadrevive
      POSTGRES_USER: leadrevive
      POSTGRES_PASSWORD: leadrevive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
