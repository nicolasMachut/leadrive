[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[build.args]
NEXT_PUBLIC_API_URL = "${{NEXT_PUBLIC_API_URL}}"
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "${{NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}}"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "${{NEXT_PUBLIC_CLERK_SIGN_IN_URL}}"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "${{NEXT_PUBLIC_CLERK_SIGN_UP_URL}}"
NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "${{NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL}}"
NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL = "${{NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL}}"
NEXT_PUBLIC_ENV = "${{NEXT_PUBLIC_ENV}}"
NEXT_PUBLIC_FACEBOOK_APP_ID = "${{NEXT_PUBLIC_FACEBOOK_APP_ID}}"
NEXT_PUBLIC_FACEBOOK_CONFIG_ID = "${{NEXT_PUBLIC_FACEBOOK_CONFIG_ID}}"
NEXT_PUBLIC_FACEBOOK_SOLUTION_ID = "${{NEXT_PUBLIC_FACEBOOK_SOLUTION_ID}}"
NEXT_PUBLIC_SENTRY_DSN = "${{NEXT_PUBLIC_SENTRY_DSN}}"
NEXT_PUBLIC_SENTRY_ENVIRONMENT = "${{NEXT_PUBLIC_SENTRY_ENVIRONMENT}}"
SENTRY_DSN = "${{SENTRY_DSN}}"
SENTRY_ENVIRONMENT = "${{NEXT_PUBLIC_SENTRY_ENVIRONMENT}}"
SENTRY_ORG = "${{SENTRY_ORG}}"
SENTRY_PROJECT = "${{SENTRY_PROJECT}}"
SENTRY_AUTH_TOKEN = "${{SENTRY_AUTH_TOKEN}}"
SENTRY_RELEASE = "${{RAILWAY_GIT_COMMIT_SHA}}"

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
