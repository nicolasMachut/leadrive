    <path d="M13.3 140 Q13.3 153.3 26.7 153.3 L50 153.3 Q63.3 153.3 63.3 140 L86.7 26.7 L60 26.7 Z" fill="#FBF8F1"/>
    <path d="M100 26.7 L126.7 26.7 L150 140 Q150 153.3 136.7 153.3 L113.3 153.3 Q100 153.3 100 140 Z" fill="#FBF8F1" opacity="0.6"/>
