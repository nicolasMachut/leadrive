  <!-- Tagline -->
  <text x="500" y="352" font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#FBF8F1" opacity="0.75">Exploitez le potentiel de vos leads.</text>
